name: Prune Chat Attachments

on:
  workflow_dispatch:
    inputs:
      retention_days:
        description: 'Keep chat attachments for at least this many days (minimum: 30)'
        required: true
        default: '180'
        type: string
      production_acknowledgement:
        description: 'Type I_UNDERSTAND_THIS_MODIFIES_PRODUCTION_DATA to run'
        required: true
        type: string

jobs:
  prune-chat-attachments:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prune chat attachments
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CHAT_ATTACHMENT_RETENTION_DAYS: ${{ inputs.retention_days }}
          CHAT_ATTACHMENT_PRUNE_ACKNOWLEDGEMENT: ${{ inputs.production_acknowledgement }}
        run: pnpm chat:prune-attachments
