name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: salon
          POSTGRES_PASSWORD: salon_local_password
          POSTGRES_DB: salon_management
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salon -d salon_management"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      DATABASE_URL: postgresql://salon:salon_local_password@localhost:5432/salon_management?schema=public
      E2E_DATABASE_URL: postgresql://salon:salon_local_password@localhost:5432/salon_management?schema=public
      NEXTAUTH_SECRET: test-secret-key-for-ci
      NEXTAUTH_URL: http://localhost:3000
      JWT_SECRET: test-jwt-secret-for-ci
      RESEND_API_KEY: test-resend-api-key
      USE_MOCK_FALLBACK: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare test database
        run: pnpm exec prisma db push

      - name: Run CI checks
        run: ./scripts/ci.sh
